[project]
name = "ai-research-agent"
version = "0.1.0"
description = "Evidence-checked web research with traceable citations (access-restricted pilot)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.7",
    "httpx>=0.27",
    "openai>=3.35.1",
    "anthropic>=0.40",
    "tldextract>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
]

[tool.uv]
# An application, not a distributable package: `uv sync` installs dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]  # keep (str, Enum): members stay plain strings for JSON and telemetry codes

[tool.ruff.lint.per-file-ignores]
# Prose, synthetic corpus text, CSS and test strings are not wrapped mid-sentence.
"ui/copy.py" = ["E501"]
"ui/theme.py" = ["E501"]
"adapters/fakes.py" = ["E501"]
"pipeline/prompts.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["arg-type", "index", "union-attr", "attr-defined", "call-arg", "func-returns-value", "type-arg", "assignment"]
